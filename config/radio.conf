# Radio001 Configuration File
# Central configuration for WiFi, Network, and System settings

# ============================================
# WiFi Hotspot Configuration
# ============================================

# Hotspot Network Name (SSID)
HOTSPOT_SSID=Radio-Setup

# Hotspot Password (minimum 8 characters for WPA2)
HOTSPOT_PASSWORD=Configure123!

# Hotspot IP Address
HOTSPOT_IP=192.168.4.1

# DHCP Range for connected clients
HOTSPOT_DHCP_RANGE=192.168.4.2,192.168.4.20

# WiFi Interface
WIFI_INTERFACE=wlan0

# Ethernet Interface
ETH_INTERFACE=eth0

# ============================================
# Network Access Configuration
# ============================================

# mDNS hostname (access via http://HOSTNAME.local)
MDNS_HOSTNAME=radio

# Hotspot mode URL (used in UI messages)
HOTSPOT_URL=http://192.168.4.1

# Alternative hostname URL
HOSTNAME_URL=http://radio.local

# ============================================
# Boot Behavior
# ============================================

# Enable automatic hotspot fallback on boot if WiFi not connected
HOTSPOT_ENABLE_FALLBACK=true

# WiFi connection timeout on boot (seconds)
WIFI_BOOT_TIMEOUT=5

# WiFi connection timeout for manual connections (seconds)
WIFI_CONNECT_TIMEOUT=40

# ============================================
# System Configuration
# ============================================

# Host mode marker file (determines if in hotspot mode)
HOST_MODE_FILE=/etc/raspiwifi/host_mode

# Backend API port
API_PORT=8000

# Development mode (enables mock hardware/wifi)
DEVELOPMENT_MODE=false

# ============================================
# GPIO Hardware Pins (BCM numbering)
# See https://pinout.xyz for BCM ↔ physical pin reference
# ============================================

# Station buttons
BUTTON_PIN_1=17   # BCM17 = physical pin 11
BUTTON_PIN_2=16   # BCM16 = physical pin 36
BUTTON_PIN_3=26   # BCM26 = physical pin 37

# Rotary encoder
ROTARY_CLK=11     # BCM11 = physical pin 23 (Clock)
ROTARY_DT=9       # BCM9  = physical pin 21 (Data)
ROTARY_SW=10      # BCM10 = physical pin 19 (Switch / push button)

# Set to false if turning clockwise decreases volume on your encoder
ROTARY_CLOCKWISE_INCREASES=true

# Volume change per encoder step (1-20)
ROTARY_VOLUME_STEP=5

# Debounce window in seconds (increase if encoder fires twice per click)
ROTARY_DEBOUNCE=0.05

# ============================================
# Button Timings
# ============================================

# Seconds the button must be held to trigger a long press
LONG_PRESS_DURATION=2.0

# Maximum gap in seconds between presses to count as a triple press
TRIPLE_PRESS_INTERVAL=0.5

# ============================================
# Volume
# ============================================

DEFAULT_VOLUME=50
MIN_VOLUME=30
MAX_VOLUME=100
NOTIFICATION_VOLUME=40

# ============================================
# ALSA Audio
# ============================================

# ALSA mixer control used by amixer to set volume.
# Common values: PCM, Master, Headphone
# Run `amixer scontrols` inside the container to list available controls.
ALSA_MIXER_CONTROL=PCM

# ============================================
# Default Radio Stations
# Used when a slot has never been configured by the user.
# ============================================

DEFAULT_STATION_1_NAME=SRF 3
DEFAULT_STATION_1_URL=https://stream.srg-ssr.ch/m/srf3/mp3_128

DEFAULT_STATION_2_NAME=Radio Swiss Jazz
DEFAULT_STATION_2_URL=https://stream.srg-ssr.ch/m/rsj/mp3_128

DEFAULT_STATION_3_NAME=Radio Swiss Classic
DEFAULT_STATION_3_URL=https://stream.srg-ssr.ch/m/rsc_de/mp3_128

# ============================================
# Radio Configuration
# ============================================

# Number of station slots
RADIO_STATION_SLOTS=3

# Station data directory
RADIO_DATA_DIR=/app/data

# Last-played state file (slot + volume persisted across reboots)
RADIO_STATE_FILE=/app/data/radio_state.json

# ============================================
# Audio Configuration
# ============================================

# Audio output device
AUDIO_DEVICE=default

# Enable sound notifications
ENABLE_SOUND_NOTIFICATIONS=true

# Sound assets directory
SOUND_ASSETS_DIR=/app/assets/sounds
