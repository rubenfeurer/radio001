# Production Docker Compose for Radio Pi
# Frontend is baked into the backend image; no separate nginx service needed.
# Watchtower pulls :latest nightly at 03:00.

services:
  radio-backend:
    image: ghcr.io/rubenfeurer/radio001:latest
    container_name: radio-backend-prod
    network_mode: host
    volumes:
      - /opt/radio/config:/app/config:ro
      - /opt/radio/data:/app/data
      - /etc/raspiwifi:/etc/raspiwifi:rw
      - /dev:/dev:rw
      - /sys/class/net:/sys/class/net:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - NODE_ENV=production
      - API_PORT=8000
      - HOSTNAME=radio
      - WIFI_TIMEOUT=5
      - WIFI_CHECK_ENABLED=true
      - HOST_MODE_FILE=/etc/raspiwifi/host_mode
      - ALSA_DEVICE=hw:2,0
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
      - /dev/gpiochip0
      - /dev/snd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  watchtower:
    image: containrrr/watchtower
    container_name: radio-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
    restart: unless-stopped
