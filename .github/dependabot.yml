version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Only accept stable releases — no alpha/beta/rc versions
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Python: ignore pre-release major versions (3.14+ still in beta)
      - dependency-name: "python"
        versions: ["3.14", "3.14.*", "3.14-*", "3.15", "3.15.*", "3.15-*"]
      # Node: ignore odd (non-LTS) major versions — 21, 23, 25 are current/non-LTS
      # LTS versions: 20 (maintenance), 22 (active), 24 (upcoming)
      - dependency-name: "node"
        versions: ["21", "21.*", "21-*", "23", "23.*", "23-*", "25", "25.*", "25-*"]
