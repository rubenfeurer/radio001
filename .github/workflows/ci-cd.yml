name: Main CI/CD - Full Validation & Deployment

permissions:
  contents: read

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "20"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build frontend for CI
        run: |
          npm install
          cd frontend
          npm run install:force
          npm run build:ci

      - name: Build and test with Docker
        run: |
          # Build backend container
          docker compose -f docker/compose.ci.yml build radio-backend

          # Start services
          docker compose -f docker/compose.ci.yml up -d

          # Wait for backend to be ready
          echo "Waiting for backend to start..."
          for i in {1..18}; do
            if curl -sf http://localhost:8000/health; then
              echo "Backend health check passed"
              break
            else
              echo "Health check attempt $i/18 failed, retrying..."
              if [ $i -eq 18 ]; then
                echo "Backend logs:"
                docker compose -f docker/compose.ci.yml logs radio-backend
                exit 1
              fi
              sleep 5
            fi
          done

          # Test API directly
          echo "Testing API directly..."
          if curl -f http://localhost:8000/health; then
            echo "Direct API test passed"
          else
            echo "Direct API test failed"
            docker compose -f docker/compose.ci.yml logs radio-backend
            exit 1
          fi

          echo "All health checks passed!"

        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Run comprehensive backend tests in Docker
        run: |
          echo "Running backend tests in Docker container..."

          # Run tests inside the backend container
          docker compose -f docker/compose.ci.yml exec -T radio-backend bash -c "
            # Set test environment
            export NODE_ENV=development
            export MOCK_HARDWARE=true
            export PYTHONPATH=/app:\$PYTHONPATH

            # Install test dependencies if not already installed
            pip install -r requirements-test.txt

            # Run comprehensive test suite
            python -m pytest \
              --verbose \
              --cov=core \
              --cov=hardware \
              --cov=api \
              --cov-report=term-missing \
              --cov-report=xml:/app/coverage.xml \
              --cov-report=html:/app/htmlcov \
              --junitxml=/app/test-results.xml \
              --tb=short \
              --maxfail=5 \
              tests/

            # Show coverage summary
            echo '=== COVERAGE SUMMARY ==='
            coverage report --show-missing

            # Show test statistics
            echo '=== TEST STATISTICS ==='
            echo 'Total tests run:' \$(python -c \"import xml.etree.ElementTree as ET; print(ET.parse('/app/test-results.xml').getroot().attrib['tests'])\")
            echo 'Test failures:' \$(python -c \"import xml.etree.ElementTree as ET; print(ET.parse('/app/test-results.xml').getroot().attrib.get('failures', '0'))\")
            echo 'Test errors:' \$(python -c \"import xml.etree.ElementTree as ET; print(ET.parse('/app/test-results.xml').getroot().attrib.get('errors', '0'))\")
          "

      - name: Extract test results from Docker
        if: always()
        run: |
          # Create results directory
          mkdir -p test-results

          # Copy test results from container
          docker compose -f docker/compose.ci.yml cp radio-backend:/app/test-results.xml test-results/ || echo "No test-results.xml found"
          docker compose -f docker/compose.ci.yml cp radio-backend:/app/coverage.xml test-results/ || echo "No coverage.xml found"
          docker compose -f docker/compose.ci.yml cp radio-backend:/app/htmlcov test-results/ || echo "No htmlcov found"

          # Show what we extracted
          ls -la test-results/

      - name: Upload Docker test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-test-results
          path: |
            test-results/
          retention-days: 30

      - name: Upload Docker coverage to Codecov
        uses: codecov/codecov-action@v5
        if: success()
        with:
          files: test-results/coverage.xml
          flags: backend-docker
          name: backend-docker-coverage

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker/compose.ci.yml logs
          docker compose -f docker/compose.ci.yml down -v

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # =============================================================================
  # Backend Test Analysis
  # =============================================================================
  test-analysis:
    name: Test Analysis & Reporting
    runs-on: ubuntu-latest
    needs: integration
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-test-results
          path: test-results/

      - name: Analyze test results
        run: |
          echo "=== BACKEND TEST ANALYSIS ==="

          if [ -f "test-results/test-results.xml" ]; then
            echo "📊 Test Results Summary:"
            python3 -c "import xml.etree.ElementTree as ET,sys; root=ET.parse('test-results/test-results.xml').getroot(); tests=root.attrib.get('tests','0'); failures=root.attrib.get('failures','0'); errors=root.attrib.get('errors','0'); skipped=root.attrib.get('skipped','0'); t=root.attrib.get('time','0'); [print(f'Total Tests: {tests}'), print(f'Passed: {int(tests)-int(failures)-int(errors)-int(skipped)}'), print(f'Failed: {failures}'), print(f'Errors: {errors}'), print(f'Skipped: {skipped}'), print(f'Duration: {float(t):.2f}s')]; sys.exit(1 if int(failures)>0 or int(errors)>0 else 0)"
          else
            echo "No test results found"
            exit 1
          fi

          if [ -f "test-results/coverage.xml" ]; then
            echo ""
            echo "📈 Coverage Analysis:"
            python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('test-results/coverage.xml').getroot(); cov=float(root.attrib.get('line-rate','0'))*100; print(f'Line Coverage: {cov:.1f}%'); print('Good coverage!' if cov>=23 else 'Coverage below 23% threshold\nTarget: Increase test coverage')"
          fi

  # =============================================================================
  # Docker Build & Push
  # =============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [integration, security]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

