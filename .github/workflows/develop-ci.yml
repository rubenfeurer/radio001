name: Develop CI - Quick Validation

permissions:
  contents: read

on:
  push:
    branches: [develop]

env:
  NODE_VERSION: "20"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =============================================================================
  # Quick Linting & Type Checking
  # =============================================================================
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm install

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm run install:force

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript type checking
        run: |
          cd frontend
          npm run check:ci

  # =============================================================================
  # Quick Build Validation
  # =============================================================================
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm install

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm run install:force

      - name: Build frontend
        run: |
          cd frontend
          npm run build:ci

      - name: Verify build output
        run: |
          cd frontend
          ls -la build/
          test -f build/index.html

  # =============================================================================
  # Quick Docker Backend Test
  # =============================================================================
  backend-smoke-test:
    name: Backend Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start backend service
        run: |
          docker compose -f docker/compose.ci.yml up -d radio-backend
          sleep 15

      - name: Test backend health
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8000/health; then
              echo "Backend health check passed!"
              break
            else
              echo "Health check attempt $i/10 failed, retrying..."
              if [ $i -eq 10 ]; then
                echo "Backend health check failed after 10 attempts"
                exit 1
              fi
              sleep 5
            fi
          done

      - name: View backend logs
        if: failure()
        run: |
          docker compose -f docker/compose.ci.yml logs radio-backend

      - name: Run quick backend tests
        run: |
          echo "Running quick backend test suite..."

          # Run tests inside the backend container
          docker compose -f docker/compose.ci.yml exec -T radio-backend bash -c "
            # Set test environment
            export NODE_ENV=development
            export MOCK_HARDWARE=true
            export PYTHONPATH=/app:\$PYTHONPATH

            # Run quick test suite (unit, api, and integration tests — test deps pre-installed)
            python -m pytest \
              --verbose \
              --tb=short \
              --maxfail=3 \
              -m 'unit or api or integration' \
              --disable-warnings \
              tests/

            echo '✅ Quick tests passed!'
          "

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker/compose.ci.yml down -v
