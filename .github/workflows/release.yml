name: Release — Build & Publish ARM64 Image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Verify requirements.lock is in sync with requirements.in
  # ---------------------------------------------------------------------------
  verify-lockfile:
    name: Verify requirements.lock
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Check requirements.lock is up to date
        run: |
          pip-compile --generate-hashes \
            --output-file backend/requirements.lock.check \
            backend/requirements.in
          # Strip comment lines before diffing: the header contains the output
          # file path which differs between the committed file and the .check file.
          if ! diff -q \
              <(grep -v '^#' backend/requirements.lock) \
              <(grep -v '^#' backend/requirements.lock.check); then
            echo "requirements.lock is out of sync with requirements.in"
            echo "Run: pip-compile --generate-hashes --output-file=backend/requirements.lock backend/requirements.in"
            diff backend/requirements.lock backend/requirements.lock.check || true
            exit 1
          fi
          echo "requirements.lock is up to date"

  # ---------------------------------------------------------------------------
  # Build ARM64 image, push to GHCR, scan with Trivy
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push ARM64 Image
    runs-on: ubuntu-latest
    needs: verify-lockfile
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build → scan → push: no tag is published before the freshly built image
      # passes the Trivy gate. The push step below is a cache-hit re-assembly of
      # the exact image scanned here.
      - name: Build image for scanning (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/arm64
          push: false
          load: true
          tags: radio001:scan
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: radio001:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
        env:
          TRIVY_PLATFORM: linux/arm64

      - name: Push scanned image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
