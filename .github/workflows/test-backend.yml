name: Backend Test Suite - Comprehensive Testing

permissions:
  contents: read

on:
  # Sole test workflow for main (develop pushes run develop-ci.yml)
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"
      - "docker/compose*.yml"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of tests to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit
          - integration
          - api
          - websocket
      coverage_threshold:
        description: "Minimum coverage percentage required"
        required: false
        default: "70"
        type: string

env:
  PYTHON_VERSION: "3.13"
  NODE_ENV: "development"
  MOCK_HARDWARE: "true"

jobs:
  # =============================================================================
  # Test Environment Setup
  # =============================================================================
  setup:
    name: Test Environment Setup
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.setup.outputs.python-version }}
      test-type: ${{ steps.setup.outputs.test-type }}
      coverage-threshold: ${{ steps.setup.outputs.coverage-threshold }}

    steps:
      - name: Setup test parameters
        id: setup
        run: |
          echo "python-version=${{ env.PYTHON_VERSION }}" >> $GITHUB_OUTPUT
          echo "test-type=${{ github.event.inputs.test_type || 'all' }}" >> $GITHUB_OUTPUT
          echo "coverage-threshold=${{ github.event.inputs.coverage_threshold || '20' }}" >> $GITHUB_OUTPUT

      - name: Display test configuration
        run: |
          echo "🧪 Backend Test Configuration"
          echo "============================="
          echo "Python Version: ${{ env.PYTHON_VERSION }}"
          echo "Test Type: ${{ github.event.inputs.test_type || 'all' }}"
          echo "Coverage Threshold: ${{ github.event.inputs.coverage_threshold || '23' }}%"
          echo "Mock Hardware: ${{ env.MOCK_HARDWARE }}"
          echo "Environment: ${{ env.NODE_ENV }}"

  # =============================================================================
  # Unit Tests
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'unit'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements.lock
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          cd backend

          export NODE_ENV=development
          export MOCK_HARDWARE=true
          export PYTHONPATH=$PWD:$PYTHONPATH

          echo "🧪 Running Unit Tests..."
          python -m pytest \
            --verbose \
            --tb=short \
            --maxfail=10 \
            --timeout=120 \
            -m "unit" \
            --cov=core \
            --cov=hardware \
            --cov-report=term-missing \
            --cov-report=xml:unit-coverage.xml \
            --cov-report=html:unit-htmlcov \
            --junitxml=unit-results.xml \
            --durations=20 \
            tests/

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            backend/unit-results.xml
            backend/unit-coverage.xml
            backend/unit-htmlcov/
          retention-days: 7

  # =============================================================================
  # API Tests
  # =============================================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'api'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements.lock
          pip install -r requirements-test.txt

      - name: Run API tests
        run: |
          cd backend

          export NODE_ENV=development
          export MOCK_HARDWARE=true
          export PYTHONPATH=$PWD:$PYTHONPATH

          echo "🌐 Running API Tests..."
          python -m pytest \
            --verbose \
            --tb=short \
            --maxfail=10 \
            --timeout=120 \
            -m "api" \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml:api-coverage.xml \
            --cov-report=html:api-htmlcov \
            --junitxml=api-results.xml \
            --durations=20 \
            tests/

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            backend/api-results.xml
            backend/api-coverage.xml
            backend/api-htmlcov/
          retention-days: 7

  # =============================================================================
  # WebSocket Tests
  # =============================================================================
  websocket-tests:
    name: WebSocket Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'websocket'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements.lock
          pip install -r requirements-test.txt

      - name: Run WebSocket tests
        run: |
          cd backend

          export NODE_ENV=development
          export MOCK_HARDWARE=true
          export PYTHONPATH=$PWD:$PYTHONPATH

          echo "🔌 Running WebSocket Tests..."
          python -m pytest \
            --verbose \
            --tb=short \
            --maxfail=10 \
            --timeout=120 \
            -m "websocket" \
            --cov=api.routes.websocket \
            --cov-report=term-missing \
            --cov-report=xml:websocket-coverage.xml \
            --cov-report=html:websocket-htmlcov \
            --junitxml=websocket-results.xml \
            --durations=20 \
            tests/

      - name: Upload WebSocket test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: websocket-test-results
          path: |
            backend/websocket-results.xml
            backend/websocket-coverage.xml
            backend/websocket-htmlcov/
          retention-days: 7

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'integration'

    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start test services
        run: |
          # Build backend for integration testing
          docker compose -f docker/compose.ci.yml build radio-backend
          docker compose -f docker/compose.ci.yml up -d radio-backend

          # Wait for services to be ready
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Run integration tests
        run: |
          echo "🔄 Running Integration Tests..."

          docker compose -f docker/compose.ci.yml exec -T radio-backend bash -c "
            export NODE_ENV=development
            export MOCK_HARDWARE=true
            export PYTHONPATH=/app:\$PYTHONPATH

            # Run integration tests (test deps pre-installed via INSTALL_TEST_DEPS=true)
            python -m pytest \
              --verbose \
              --tb=short \
              --maxfail=5 \
              --timeout=300 \
              -m 'integration' \
              --cov=core \
              --cov=api \
              --cov-report=term-missing \
              --cov-report=xml:/app/integration-coverage.xml \
              --cov-report=html:/app/integration-htmlcov \
              --junitxml=/app/integration-results.xml \
              --durations=20 \
              tests/
          "

      - name: Extract integration test results
        if: always()
        run: |
          mkdir -p integration-results
          docker cp radio-backend-ci:/app/integration-results.xml integration-results/ || echo "No integration-results.xml found"
          docker cp radio-backend-ci:/app/integration-coverage.xml integration-results/ || echo "No integration-coverage.xml found"
          docker cp radio-backend-ci:/app/integration-htmlcov integration-results/ || echo "No integration-htmlcov found"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results/
          retention-days: 7

      - name: Cleanup integration services
        if: always()
        run: |
          docker compose -f docker/compose.ci.yml down -v

  # =============================================================================
  # Performance Tests (Optional)
  # =============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements.lock
          pip install -r requirements-test.txt
          pip install pytest-benchmark locust

      - name: Run performance tests
        run: |
          cd backend

          export NODE_ENV=development
          export MOCK_HARDWARE=true
          export PYTHONPATH=$PWD:$PYTHONPATH

          echo "⚡ Running Performance Tests..."
          python -m pytest \
            --verbose \
            --tb=short \
            --benchmark-only \
            --benchmark-json=performance-results.json \
            tests/ || echo "No performance tests found"

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: backend/performance-results.json
          retention-days: 7

  # =============================================================================
  # Security Scanning (filesystem)
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
